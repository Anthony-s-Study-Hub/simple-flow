[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-flow"
version = "0.1.0"
description = "Deterministic GitHub and CI gates for the Simple Flow workflow study."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
simple-flow-gates = "simple_flow_gates.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

