[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-flow"
version = "0.2.5"
description = "Deterministic GitHub and CI gates for the Simple Flow workflow study."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
phase4-sdk = [
  "claude-code-sdk>=0.0.25,<0.1",
  "openai-codex>=0.147,<0.148",
]

[project.scripts]
simple-flow = "simple_flow_deploy.cli:main"
simple-flow-gates = "simple_flow_gates.cli:main"
phase4-run = "simple_flow_test_harness.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["simple_flow_gates*", "simple_flow_agent*", "simple_flow_deploy*", "simple_flow_documentation_curation*", "simple_flow_test_harness*"]
exclude = ["skills*", "tests*", "scripts*"]

[tool.setuptools.package-data]
simple_flow_deploy = [
  "assets/AGENTS.md",
  "assets/skills/*/SKILL.md",
  "skill_resources/*/scripts/*.py",
]
