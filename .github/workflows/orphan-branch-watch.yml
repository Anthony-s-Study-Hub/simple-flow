name: Orphan Branch Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  pull-requests: read

jobs:
  orphan-branch-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Detect local orphan development branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.orphan_branch_watch \
            --repo "${{ github.repository }}" \
            --base "origin/${{ github.event.repository.default_branch || 'main' }}"
