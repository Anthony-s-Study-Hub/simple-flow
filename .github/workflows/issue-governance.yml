name: Issue Governance

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: read

jobs:
  issue-contract:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Write issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path("issue_body.md").write_text(os.environ["ISSUE_BODY"], encoding="utf-8")
          PY
      - name: Validate issue contract
        run: python -m simple_flow_gates.cli validate-issue --issue-body issue_body.md
