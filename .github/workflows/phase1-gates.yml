name: Phase 1 Gates

on:
  issues:
    types: [opened, edited, reopened]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  issue-gate:
    if: github.event_name == 'issues' && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Write issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path("issue_body.md").write_text(os.environ["ISSUE_BODY"], encoding="utf-8")
          PY
      - name: Validate issue contract
        run: python -m simple_flow_gates.cli validate-issue --issue-body issue_body.md

  phase1-gates:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }} --depth=100
      - name: Load linked issue body
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python - <<'PY' > issue_number.txt
          import os
          import re
          body = os.environ["PR_BODY"]
          match = re.search(r"(?:#|issues/)(\d+)\b", body, re.IGNORECASE)
          if not match:
              raise SystemExit("Pull request body does not reference a linked issue.")
          print(match.group(1))
          PY
          issue="$(cat issue_number.txt)"
          gh api "repos/${REPOSITORY}/issues/${issue}" --jq .body > issue_body.md
      - name: Run deterministic PR gates
        run: |
          issue="$(cat issue_number.txt)"
          tdd_arg=""
          if [ -f ".simple-flow/tdd-evidence/${issue}.json" ]; then
            tdd_arg="--tdd-evidence .simple-flow/tdd-evidence/${issue}.json"
          fi
          python -m simple_flow_gates.cli validate-pr \
            --event-path "$GITHUB_EVENT_PATH" \
            --issue-body issue_body.md \
            --base-ref "origin/${{ github.base_ref }}" \
            $tdd_arg
